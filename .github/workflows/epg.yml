name: Generate EPG guide

on:
  schedule:
    - cron: '30 2 * * *'   # every day at 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone the iptv-org EPG engine
        run: git clone --depth 1 https://github.com/iptv-org/epg.git .engine

      - name: Install the engine dependencies
        working-directory: .engine
        run: npm install

      - name: Grab each site in isolation, then merge
        working-directory: .engine
        run: |
          cp ../epg.channels.xml epg.channels.xml
          python3 ../split_sites.py
          mkdir -p out
          while read -r s; do
            [ -z "$s" ] && continue
            echo "::group::grab $s"
            timeout 240 npm run grab --- --channels="ch_${s}.xml" --output="out/${s}.xml" --maxConnections=15 --days=2 --timeout=20000 > "log_${s}.txt" 2>&1 || echo "site $s failed or timed out (skipped)"
            tail -n 2 "log_${s}.txt" || true
            echo "::endgroup::"
          done < sites.txt
          echo "=== per-site output ==="
          ls -la out/ || true
          python3 ../merge.py out guide.xml
          gzip -kf guide.xml
          ls -la guide.xml guide.xml.gz
          echo "programmes: $(grep -c '<programme' guide.xml || echo 0)"

      - name: Publish guide.xml.gz to the data branch
        working-directory: .engine
        run: |
          test -s guide.xml.gz || { echo "no guide produced"; exit 1; }
          gzip -t guide.xml.gz
          cp guide.xml.gz "$GITHUB_WORKSPACE/guide.xml.gz"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data
          git reset
          git add -f guide.xml.gz
          git commit -m "EPG update"
          git push -f origin data
